# Pages CMS settings: https://pagescms.org/docs/configuration/
# Lets people edit the site at https://app.pagescms.org without touching code.

# Merge mode: saving only updates the fields shown in the editor and keeps
# everything else in the file, so an out-of-date editor can't wipe settings.
settings:
  content:
    merge: true

media:
  input: public/media
  output: /media
  rename: safe

content:
  - name: works-group
    label: Works
    type: group
    items:
      - name: works
        label: Projects
        type: collection
        path: src/content/works
        format: yaml-frontmatter
        exclude: [_template.md]
        filename:
          template: "{title}.md"
          field: false
        view:
          fields: [title, category]
          primary: title
          sort: [title]
          default:
            sort: title
            order: asc
        fields:
          - name: title
            label: Title
            type: string
            required: true
          - name: type
            label: Type (short)
            type: string
            description: One or two words shown next to the title in the Selected Works list, e.g. Product, Exhibit, Animation.
          - name: category
            label: Category
            type: select
            required: true
            options:
              values: [Commercial Work, Personal Work, 3D Printing]
          - name: summary
            label: Short summary
            type: text
            required: true
            description: One or two sentences, used for link previews.
          - name: body
            label: Description
            type: rich-text
            description: The main text on the project page.
          - name: role
            label: Role
            type: string
            required: true
            description: e.g. "3D Modelling, 3D Printing, Rendering"
          - name: date
            label: Date
            type: string
            required: true
            description: Written as you want it shown, e.g. "2026" or "6 October 2023".
          - name: projectType
            label: Project type (optional)
            type: string
            description: Shown on the project page instead of the category, e.g. "Internal Company Project". Leave blank to use the category.
          - name: doneUnder
            label: Done under
            type: string
            description: Company or client, if any. Leave blank to hide.
          - name: cover
            label: Cover image or video
            type: file
            required: true
            description: Thumbnail on the Works list and the main image on the project page.
            options:
              path: public/media/works
              categories: [image, video]
          - name: coverAlt
            label: Cover description (alt text)
            type: string
            description: Describe what's in the cover photo, for people using screen readers, e.g. "Friends around a cardboard table at a picnic".
          - name: template
            label: Template
            type: select
            description: >-
              Standard = text pinned on the left, photos two across on the right (uses Story gallery if filled in, otherwise Gallery).
              Tabs = a Pieces list on the left; each piece shows its own photos on the right (uses Pieces below), like One Thing A Day.
              Leave empty for Standard.
            options:
              values:
                - name: standard
                  label: Standard
                - name: tabs
                  label: Tabs
          - name: gallery
            label: Gallery (Standard template)
            type: file
            description: Photos and videos shown two across (landscape photos go full width). Used when Story gallery is empty. Please upload JPGs under 3 MB each (bigger files fail to upload).
            options:
              path: public/media/works
              categories: [image, video]
              multiple: true
          - name: story
            label: Story gallery (Standard template)
            type: object
            description: >-
              Groups of photos, each with a heading and rows. When filled in, this replaces the plain Gallery.
              Row layouts: Full = 1 wide photo, Pair = 2 side by side, Trio = 3 in a row.
            list:
              collapsible:
                collapsed: true
                summary: "{heading}"
            fields:
              - name: heading
                label: Heading
                type: string
                required: true
              - name: intro
                label: One-line intro (optional)
                type: string
              - name: rows
                label: Rows
                type: object
                list:
                  collapsible:
                    collapsed: true
                    summary: "{layout}"
                fields:
                  - name: layout
                    label: Layout
                    type: select
                    options:
                      values:
                        - name: full
                          label: Full (1 photo)
                        - name: pair
                          label: Pair (2 photos)
                        - name: trio
                          label: Trio (3 photos)
                  - name: images
                    label: Photos
                    type: object
                    list:
                      collapsible:
                        collapsed: true
                        summary: "{caption}"
                    fields:
                      - name: src
                        label: Photo
                        type: file
                        required: true
                        options:
                          path: public/media/works
                          categories: [image, video]
                      - name: alt
                        label: Description (alt text)
                        type: string
                        description: What's in the photo, for screen readers.
                      - name: caption
                        label: Caption
                        type: string
                        description: Short text shown under the photo.
          - name: pieces
            label: Pieces (Tabs template)
            type: object
            description: Each piece becomes a tab on the project page. Drag to reorder.
            list:
              collapsible:
                collapsed: true
                summary: "{title}"
            fields:
              - name: title
                label: Tab name
                type: string
                required: true
              - name: caption
                label: Caption (optional)
                type: text
                description: A sentence or two shown under this piece's first photo.
              - name: media
                label: Photos and videos
                type: file
                options:
                  path: public/media/works
                  categories: [image, video]
                  multiple: true
          - name: sound
            label: Videos with sound
            type: file
            description: Pick any videos above that have audio worth hearing; they get a "Sound on" button.
            options:
              path: public/media/works
              categories: [video]
              multiple: true
          - name: draft
            label: Draft (preview before publishing)
            type: boolean
            description: >-
              While ticked, the project isn't listed on the site, but its page still exists so you can check it at
              https://tmingkai-pixel.github.io/portfolio-site/works/<file name>/ (about a minute after saving).
              Untick and save to publish.

      - name: works-order
        label: Order
        type: file
        path: src/data/works-order.json
        format: json
        fields:
          - name: works
            label: Projects (drag to reorder)
            type: reference
            list: true
            description: >-
              The order projects appear on the Works page and the home page gallery.
              Drag to reorder, then Save. New projects you haven't placed here are
              added at the end automatically.
            options:
              collection: works
              value: "{path}"
              label: "{title}"

  - name: about-page
    label: About page
    type: file
    path: src/data/about.json
    format: json
    fields:
      - name: tagline
        label: Tagline
        type: text
        description: The short line at the top of the left-hand menu on every page.
      - name: bio
        label: Bio paragraphs
        type: text
        list: true
        description: The About text, one paragraph per entry.
      - name: photos
        label: About photos
        type: file
        description: Photos shown in the image columns on the About page. JPGs under 3 MB each.
        options:
          path: public/media/about
          categories: [image]
          multiple: true
      - name: instagram
        label: Instagram link
        type: string
        description: Full address, starting with https:// (leave blank to hide Instagram in the menu).
      - name: portrait
        label: Portrait photo
        type: file
        description: Your photo on the navy card. A portrait-shaped JPG under 3 MB works best.
        options:
          path: public/media/about
          categories: [image]
      - name: name
        label: Name
        type: string
        required: true
      - name: intro
        label: Intro
        type: text
        description: The orange text on the navy card.
      - name: email
        label: Contact email
        type: string
        description: Used by the "Contact Me" button.
      - name: linkedin
        label: LinkedIn link
        type: string
        description: Full address, starting with https://
      - name: techSkills
        label: Tech skills
        type: string
        list: true
      - name: softSkills
        label: Soft skills
        type: string
        list: true
      - name: education
        label: Education
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - name: title
            label: Qualification
            type: string
            required: true
          - name: where
            label: School
            type: string
          - name: when
            label: Years
            type: string
            description: e.g. "2024 - 2027"
      - name: experience
        label: Professional experience
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - name: title
            label: Job title
            type: string
            required: true
          - name: roles
            label: Places
            type: object
            description: One or more places you did this job, each with its own dates and bullet points.
            list:
              collapsible:
                collapsed: true
                summary: "{where}"
            fields:
              - name: where
                label: Company
                type: string
              - name: when
                label: Years
                type: string
              - name: points
                label: Bullet points
                type: text
                list: true
